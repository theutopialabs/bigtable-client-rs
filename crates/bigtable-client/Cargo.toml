[package]
name = "bigtable-client"
description = "An async Rust client for Google Cloud Bigtable"
readme = "../../README.md"
keywords = ["bigtable", "gcp", "grpc", "tonic", "database"]
categories = ["api-bindings", "asynchronous", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["opentelemetry"]
emulator-tests = []
opentelemetry = ["dep:opentelemetry"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bigtable-client-derive = { version = "=0.0.1", path = "../bigtable-client-derive" }
bytes.workspace = true
fastrand.workspace = true
figment.workspace = true
futures-core.workspace = true
futures-util.workspace = true
gcp_auth.workspace = true
googleapis-tonic-google-bigtable-v2.workspace = true
googleapis-tonic-google-rpc.workspace = true
http.workspace = true
humantime-serde.workspace = true
opentelemetry = { workspace = true, optional = true }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
googleapis-tonic-google-bigtable-admin-v2.workspace = true
opentelemetry_sdk.workspace = true
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["server"] }
tonic-prost.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

[lints]
workspace = true
